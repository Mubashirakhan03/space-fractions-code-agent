name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the exe to a GitHub Release on v* tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Tests (MockProvider only — no API key, no cost)
        run: python -m pytest -q

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean SpaceFractionsAgent.spec

      - name: Verify exe without Python on PATH
        run: python scripts/verify_exe.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: SpaceFractionsAgent-windows
          path: dist/SpaceFractionsAgent.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/SpaceFractionsAgent.exe
          generate_release_notes: true
